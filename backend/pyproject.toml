[project]
name = "westminster-weather"
version = "0.1.0"
description = "Backend and forecasting engine for predicting UK Government Bill passage and time-to-commencement"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "beautifulsoup4>=4.12.3",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "lightgbm>=4.5.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/westminster_weather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
